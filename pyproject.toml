[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-opponent-model"
version = "0.1.0"
description = "Interpretable Limited deck reconstruction baseline"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7"]
research = ["numpy>=1.24,<3", "scikit-learn>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
